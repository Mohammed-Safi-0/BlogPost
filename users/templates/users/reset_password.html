{% extends "posts/base.html" %}

{% block contents %}
<br>

<div class="main-container">

    <div class="topbar">
        <h1 class="title">Reset Password</h1>
    </div>

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="password1" class="form-label">
                New Password
            </label>

            <input
                type="password"
                name="password1"
                id="password1"
                class="form-control"
                required
            >

            <input
                type="checkbox"
                onclick="togglePassword('password1')"
            >
            Show Password
        </div>

        <div class="mb-3">
            <label for="password2" class="form-label">
                Confirm New Password
            </label>

            <input
                type="password"
                name="password2"
                id="password2"
                class="form-control"
                required
            >

            <input
                type="checkbox"
                onclick="togglePassword('password2')"
            >
            Show Password
        </div>

        <button class="btn btn-primary" type="submit">
            Reset Password
        </button>
    </form>

</div>

<script>
    function togglePassword(id) {
        const field = document.getElementById(id);

        if (field.type === "password") {
            field.type = "text";
        } else {
            field.type = "password";
        }
    }
</script>

{% endblock %}
